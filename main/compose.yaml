services:
  workshop:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /app/data/workspace.sqlite
    volumes:
      - workshop-data:/app/data
    expose:
      - "5173"
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WORKSHOP_DOMAIN: ${WORKSHOP_DOMAIN:?请填写本项目的 HTTPS 域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - workshop
volumes:
  workshop-data:
  caddy-data:
  caddy-config:
